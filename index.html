<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Core Breaker: Incremental Singularity</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background: #070913;
      color: #e0f7fa;
      font-family: 'Segoe UI', Consolas, monospace;
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      flex: 1;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 20px;
      pointer-events: none;
    }
    .stat-box {
      background: rgba(7, 9, 19, 0.85);
      border: 1px solid #00f3ff;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
      padding: 10px 18px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .currency { font-size: 26px; font-weight: bold; color: #ffe600; text-shadow: 0 0 8px rgba(255, 230, 0, 0.6); }
    .sub-stat { font-size: 13px; color: #80deea; margin-top: 4px; }
    
    #sidebar {
      width: 360px;
      background: #0b0e1d;
      border-left: 1px solid #1a2342;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }
    .sidebar-header {
      padding: 16px;
      background: #10152c;
      border-bottom: 1px solid #00f3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-title { font-size: 16px; font-weight: bold; color: #00f3ff; letter-spacing: 1px; }
    .btn-small {
      background: transparent;
      border: 1px solid #ff0055;
      color: #ff80ab;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-small:hover { background: rgba(255, 0, 85, 0.2); }
    
    #upgrade-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .upgrade-card {
      background: #131833;
      border: 1px solid #263159;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .upgrade-card:hover { border-color: #00f3ff; transform: translateX(-2px); }
    .upgrade-card.affordable {
      border-color: #00ff88;
      box-shadow: inset 0 0 8px rgba(0, 255, 136, 0.15);
    }
    .upgrade-card.maxed {
      opacity: 0.6;
      border-color: #555;
      cursor: default;
    }
    .upg-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .upg-name { color: #ffffff; }
    .upg-lvl { color: #00f3ff; }
    .upg-desc { font-size: 12px; color: #9fa8da; margin-bottom: 8px; }
    .upg-cost { font-size: 13px; font-weight: bold; color: #ffe600; text-align: right; }
    .milestone-badge {
      display: inline-block;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid #ff0055;
      color: #ff80ab;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="stat-box">
        <div class="currency"><span id="ui-data">0</span> DATA</div>
        <div class="sub-stat">レーザー威力: <span id="ui-power">1.0</span> / 秒間照射</div>
        <div class="sub-stat">自律ドローン: <span id="ui-drones">0</span> 機稼働中</div>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">UPGRADE MATRIX</span>
      <button class="btn-small" id="btn-reset">データ初期化</button>
    </div>
    <div id="upgrade-list"></div>
  </div>

  <!-- 順番に読み込み（ローカル実行でCORSエラーを出さないため） -->
  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>

name: Filter Python 3.14/3.15 cross-platform compatibility

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.txt'
      - 'filter-profiles.json'
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/filter-python-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-python:
    name: filter-python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.14.10', '3.15.2']
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Report exact Python runtime
        run: python -VV
      - name: Run filter unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate filter lists
        run: python scripts/validate_lists.py
      - name: Verify generated output parity
        run: python scripts/generate_lists.py --check

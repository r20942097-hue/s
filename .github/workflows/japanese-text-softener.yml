name: Japanese Text Softener checks

on:
  push:
    paths:
      - 'japanese-text-softener*.txt'
      - 'tests/test_japanese_text_softener.py'
      - '.github/workflows/japanese-text-softener.yml'
  pull_request:
    paths:
      - 'japanese-text-softener*.txt'
      - 'tests/test_japanese_text_softener.py'
      - '.github/workflows/japanese-text-softener.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run filter regression tests
        run: python -m unittest discover -s tests -p 'test_japanese_text_softener.py' -v
